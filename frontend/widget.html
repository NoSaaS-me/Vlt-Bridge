<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Widget CSP — slightly relaxed to allow embedding in ChatGPT iframe,
      but still guards against XSS and credential exfiltration.
      frame-ancestors is intentionally omitted here (widget is meant to be framed).
      The parent (ChatGPT) controls framing. We still block inline scripts and eval.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:;
      connect-src 'self';
      font-src 'self' data:;
      base-uri 'self';
      form-action 'none';
    " />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Document Widget</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/widget.tsx"></script>
  </body>
</html>

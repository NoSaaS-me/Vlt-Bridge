[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlt-connectors"
version = "0.1.0"
description = "Shared connector system for Vlt-Bridge"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "cryptography>=42.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vlt_connectors"]
